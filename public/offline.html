<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#910121" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión | CCD</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f9fafb;
        color: #1f2937;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 440px; }
      img { height: 56px; width: auto; margin-bottom: 32px; }
      h1 {
        margin: 0 0 12px;
        font-family: Merriweather, Georgia, serif;
        font-size: 2rem;
        color: #910121;
      }
      p { margin: 0 0 28px; line-height: 1.6; color: #4b5563; }
      button {
        padding: 12px 32px;
        border: 2px solid #910121;
        background: #910121;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover { background: #700708; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logoccd.svg" alt="CCD" />
      <h1 id="title">Sin conexión</h1>
      <p id="text">
        No pudimos cargar esta página. Revisa tu conexión a internet e inténtalo de nuevo.
      </p>
      <button id="retry" type="button">Reintentar</button>
    </main>
    <script>
      // Usa el idioma elegido en el sitio (guardado por el selector del navbar)
      var texts = {
        es: ["Sin conexión", "No pudimos cargar esta página. Revisa tu conexión a internet e inténtalo de nuevo.", "Reintentar", "Sin conexión | CCD"],
        en: ["You're offline", "We couldn't load this page. Check your internet connection and try again.", "Try again", "Offline | CCD"],
      };
      var lang = "es";
      try { if (localStorage.getItem("ccd-lang") === "en") lang = "en"; } catch (e) {}
      var t = texts[lang];
      document.documentElement.lang = lang;
      document.title = t[3];
      document.getElementById("title").textContent = t[0];
      document.getElementById("text").textContent = t[1];
      document.getElementById("retry").textContent = t[2];
      document.getElementById("retry").addEventListener("click", function () {
        location.reload();
      });
      // Si vuelve la conexión, recarga sola
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
